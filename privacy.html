<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Digital With Nabin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:linear-gradient(135deg,#070c14,#20100a,#070c14);color:#eef2ff;line-height:1.7;padding:1rem;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:2rem 1rem}
.hero{text-align:center;margin-bottom:2rem;padding:2.5rem 1rem;background:linear-gradient(135deg,rgba(255,107,107,.15),rgba(255,215,0,.15));border:1px solid rgba(255,107,107,.3);border-radius:24px}
.hero i{font-size:3.5rem;background:linear-gradient(135deg,#ff6b6b,#ffd966);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.5rem;display:block}
.hero h1{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#ff6b6b,#ffd966,#2aff9e);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.5rem}
.hero p{color:#7a8aaa;font-size:.85rem}
.back-btn{display:inline-flex;align-items:center;gap:.5rem;background:linear-gradient(135deg,#ff6b6b,#ffd966);color:#070c14;padding:.7rem 1.5rem;border-radius:30px;text-decoration:none;font-weight:800;font-size:.85rem;margin-bottom:1.5rem}
.card-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:1.5rem}
.card{background:rgba(12,18,28,.85);border:1px solid rgba(255,107,107,.25);border-radius:20px;padding:1.5rem;text-align:center;position:relative;overflow:hidden;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(255,107,107,.2)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff6b6b,#ffd966,#2aff9e);border-radius:20px 20px 0 0}
.card i{font-size:2rem;margin-bottom:.7rem;display:block}
.card:nth-child(1) i{color:#2aff9e}
.card:nth-child(2) i{color:#60a5fa}
.card:nth-child(3) i{color:#a855f7}
.card h3{font-size:1rem;font-weight:800;margin-bottom:.5rem;color:#fff}
.card a{color:#2aff9e;text-decoration:none;font-size:.85rem;font-weight:600;word-break:break-all}
.card p{color:#7a8aaa;font-size:.8rem;margin-top:.3rem}
.section{background:rgba(12,18,28,.85);border:1px solid rgba(42,255,158,.2);border-radius:20px;padding:1.5rem;margin-bottom:1.2rem}
.section h2{font-size:1.1rem;font-weight:800;color:#2aff9e;margin-bottom:1rem;display:flex;align-items:center;gap:.7rem}
.section p{color:#cdd9ff;font-size:.9rem;margin-bottom:.8rem}
.footer{text-align:center;margin-top:2rem;padding:1.5rem;color:#7a8aaa;font-size:.8rem;border-top:1px solid rgba(255,107,107,.15)}
@media(min-width:600px){.card-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="container">

  <a href="/" class="back-btn">← Back to Home</a>

  <div class="hero">
    <i class="fas fa-headset"></i>
    <h1>Contact Us</h1>
    <p>We'd love to hear from you</p>
  </div>

  <div class="card-grid">
    <div class="card">
      <i class="fas fa-envelope"></i>
      <h3>Email</h3>
      <a href="mailto:nabinkhanal0007@gmail.com">nabinkhanal0007@gmail.com</a>
      <p>Response:
